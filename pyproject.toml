[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrouter-free-agent"
version = "0.1.0"
description = "A small, CPU-only tool agent using OpenRouter-hosted models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=1.0", "pydantic>=2", "python-dotenv>=1", "rich>=13", "tzdata>=2024; platform_system == 'Windows'"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
free-agent = "free_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires an OpenRouter API key and makes a live request"]
